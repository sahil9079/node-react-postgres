global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "skills-apiserver"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["apiserver:8010"]
        labels:
          service: "apiserver"
          namespace: "node-react-app"
          environment: "local-compose"
