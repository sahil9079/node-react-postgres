apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: node-react-app

resources:
  - ../../namespace.yaml
  - ../../serviceaccount.yaml
  - ../../rbac.yaml
  - ../../configmap.yaml
  - ../../secret.yaml
  - ../../apidep.yaml
  - ../../apisrc.yaml
  - ../../clientdep.yaml
  - ../../clientsrc.yaml
  - ../../ingress.yaml
  - ../../hpa.yaml
  - ../../pdb.yaml

patches:
  - target:
      kind: ConfigMap
      name: configmap
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: "skills-lab-postgres.REPLACE_RDS_ID.ap-south-1.rds.amazonaws.com"
      - op: replace
        path: /data/DB_SSL
        value: "true"
  - target:
      kind: Deployment
      name: apiserver
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: my-app-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
