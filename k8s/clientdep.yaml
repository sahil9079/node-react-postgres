apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: node-react-app 
  labels:
    app: client-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
    spec:
      containers:
        - name: client-server
          image: sahil9079/js-client:v1.1.0
          ports:
            - name: client-port
              containerPort: 80