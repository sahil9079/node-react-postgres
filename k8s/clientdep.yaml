apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: node-react-app
  labels:
    app: client-app
    tier: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: client-app
  template:
    metadata:
      labels:
        app: client-app
        tier: frontend
    spec:
      serviceAccountName: skills-app-sa
      containers:
        - name: client-server
          image: sahil9079/js-client:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: client-port
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: client-port
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: client-port
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3