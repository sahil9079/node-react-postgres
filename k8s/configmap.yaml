apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap
  namespace: node-react-app
data:
  NODE_ENV: "production"
  PORT: "8010"
  PORT_DEV: "8010"
  PORT_PROD: "8010"
  API_VERSION: "v1"
  # In AWS EKS overlays, DB_HOST is patched with the Private Amazon RDS PostgreSQL endpoint
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "sampledb"
  DB_SSL: "false"
  JWT_VERIFY_EXPIRY: "1d"
  JWT_SESSION_EXPIRY: "1d"
  JWT_REFRESH_EXPIRY: "30d"
  SESSION_ALGORITHM: "aes-192-cbc"
  SESSION_COOKIE_NAME: "__sample_session"
  PASSWORD_HASH_CYCLE: "10"