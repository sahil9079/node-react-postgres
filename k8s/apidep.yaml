apiVersion: apps/v1
kind: Deployment
metadata:
 name: apiserver
 namespace: node-react-app
 labels:
   app: apiserver
spec:
 replicas: 1
 selector:
   matchLabels:
     app: apiserver
 template:
   metadata:
     labels:
       app: apiserver
   spec:
     containers:
     - name: apiserver
       image: sahil9079/js-apiserver:v1.1.0
       ports:
         - name: apiserver-port
           containerPort: 8010
       envFrom:
         - configMapRef:
              name: configmap   
         - secretRef:
              name: my-secret 
             
             
        
       